[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "egohand-live"
version = "0.1.0"
description = "Real-time 3D hand tracking from a single RGB camera with NVIDIA EgoHand, plus an Isaac Sim teleoperation bridge."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "timfmartin" }]
keywords = ["hand tracking", "teleoperation", "isaac sim", "isaac lab", "egohand", "openxr", "robotics", "dexterous manipulation"]
classifiers = [
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: POSIX :: Linux",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy",
  "opencv-python",
  "pyzmq>=26",
  "msgpack>=1.0",
  "scipy",
]

[project.optional-dependencies]
realsense = ["pyrealsense2"]
viz = ["rerun-sdk>=0.24"]
retarget = ["dex-retargeting>=0.5,<0.6", "pyyaml", "torch"]

[project.urls]
Homepage = "https://github.com/timfmartin/egohand-live"
Issues = "https://github.com/timfmartin/egohand-live/issues"

[project.scripts]
egohand-live = "egohand_live.cli:main"

[tool.setuptools.packages.find]
include = ["egohand_live*"]
